<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <section class="todo-card">
      <header class="todo-header">
        <h1>Todo List</h1>
        <p>Kelola tugas harian dengan status dan tanggal deadline.</p>
      </header>

      <form class="todo-form" id="todoForm">
        <div class="form-group">
          <label for="inputTask">Nama Tugas</label>
          <input type="text" id="inputTask" placeholder="Contoh: Belajar JavaScript" />
        </div>

        <div class="form-group">
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal" />
        </div>

        <button type="submit" id="btnTambahTodo">Tambah Tugas</button>
      </form>

      <section class="todo-section">
        <h2>Daftar Tugas</h2>
        <ul class="todo-list" id="listTugas"></ul>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
